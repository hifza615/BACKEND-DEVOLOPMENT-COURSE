<!-- =========================================================
     HTML & CSS BASICS — ASSIGNMENT 02
     QUESTION 4 — STYLE YOUR "STUDENT REGISTRATION FORM"

     Question:
     Take the registration.html file from Assignment 01
     and apply CSS to make it a clean student registration
     form.

     Requirements:
     1. Create registration.css.
     2. Create a main form container.
     3. Use width, padding, margin and border.
     4. Style labels and input fields.
     5. Style email, password and date inputs.
     6. Style radio buttons and checkboxes.
     7. Style select and textarea.
     8. Style submit and reset buttons.
     9. Use Flexbox for at least one part.
     10. Use display appropriately.
     11. Use different colors.
     12. Use typography properties.
     13. Use position: relative or absolute.
     14. Use px, %, rem, vh or vw.
     =========================================================
     ANSWER
     =========================================================
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <div class="form-container">

        <h1>Student Registration Form</h1>

        <p class="form-intro">
            Please fill in the following information.
        </p>

        <form>

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name">


            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email">


            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password">


            <label for="date">Date of Birth</label>
            <input type="date" id="date">


            <label>Gender</label>

            <div class="gender-options">

                <label>
                    <input type="radio" name="gender">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender">
                    Female
                </label>

            </div>


            <label>Programming Languages</label>

            <div class="language-options">

                <label>
                    <input type="checkbox">
                    HTML
                </label>

                <label>
                    <input type="checkbox">
                    CSS
                </label>

                <label>
                    <input type="checkbox">
                    JavaScript
                </label>

            </div>


            <label for="course">Select Course</label>

            <select id="course">

                <option>Select a course</option>
                <option>Web Development</option>
                <option>Graphic Designing</option>
                <option>Python Programming</option>

            </select>


            <label for="message">Why do you want to join?</label>

            <textarea
                id="message"
                rows="5"
                placeholder="Write your answer here...">
            </textarea>


            <div class="buttons">

                <button type="submit">
                    Submit
                </button>

                <button type="reset">
                    Reset
                </button>

            </div>

        </form>

    </div>

</body>

</html>
