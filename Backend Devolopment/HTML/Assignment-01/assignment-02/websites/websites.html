<!-- =========================================================
     HTML & CSS BASICS — ASSIGNMENT 02
     QUESTION 2 — STYLE YOUR "MY FAVORITE WEBSITES" PAGE

     Question:
     Take the websites.html file from Assignment 01 and
     style it using an external CSS stylesheet.

     Requirements:
     1. Create websites.html and websites.css.
     2. Style the main heading.
     3. Style all website links.
     4. Add background color.
     5. Style the image using the Box Model.
     6. Use width, height, padding, border and margin.
     7. Use border-radius.
     8. Create a styled container around the links.
     9. Use display such as block or inline-block.
     10. Use px, %, and rem units.
     =========================================================

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favorite Websites</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="websites.css">
</head>

<body>

    <h1>My Favorite Websites</h1>

    <p>
        I frequently use Google, YouTube, GitHub, and LinkedIn
        for learning, research, entertainment, networking,
        and coding projects.
    </p>

    <h2>My Favorite Websites</h2>

    <div class="links-container">

        <ul>

            <li>
                <a href="https://www.google.com" target="_blank">
                    Google
                </a>
            </li>

            <li>
                <a href="https://www.youtube.com" target="_blank">
                    YouTube
                </a>
            </li>

            <li>
                <a href="https://github.com/hifza615" target="_blank">
                    My GitHub
                </a>
            </li>

            <li>
                <a href="https://www.linkedin.com/in/hifza-emaan-3b06193b2/"
                    target="_blank">
                    LinkedIn
                </a>
            </li>

        </ul>

    </div>

    <h2>Website Logos</h2>

    <div class="logos">

        <a href="https://www.google.com" target="_blank">
            <img
                src="https://www.google.com/favicon.ico"
                alt="Google Logo">
        </a>

        <a href="https://www.youtube.com" target="_blank">
            <img
                src="https://www.youtube.com/favicon.ico"
                alt="YouTube Logo">
        </a>

        <a href="https://github.com/hifza615" target="_blank">
            <img
                src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                alt="GitHub Logo">
        </a>

        <a href="https://www.linkedin.com/in/hifza-emaan-3b06193b2/"
            target="_blank">
            <img
                src="https://cdn-icons-png.flaticon.com/512/174/174857.png"
                alt="LinkedIn Logo">
        </a>

    </div>

</body>

</html>
