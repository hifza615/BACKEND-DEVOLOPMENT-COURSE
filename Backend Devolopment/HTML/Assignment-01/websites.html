<!-- =========================================================
     HTML BASICS — ASSIGNMENT 01
     QUESTION 2 — LINKS AND IMAGES
     =========================================================

     Question:
     Create a webpage called "My Favorite Websites".

     The page should contain:
     1. A heading: "My Favorite Websites".
     2. A paragraph explaining which websites you frequently use.
     3. At least 3 links to different websites.
     4. Each link should open in a new browser tab.
     5. Add an image below the links.
     6. The image must contain appropriate alt text.
     7. Make the image clickable so that clicking the image
        opens a website.

     Task:
     Write the HTML code required to create this webpage.

     Hint:
     Think about how <a> and <img> can be used together.

     =========================================================
     ANSWER
     =========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Websites</title>
</head>

<body>

    <h1>My Favorite Websites</h1>

    <p>
        I frequently use Google, YouTube, GitHub, and LinkedIn
        for learning, research, entertainment, networking,
        and coding projects.
    </p>

    <h2>My Favorite Websites</h2>

    <ul>

        <li>
            <a href="https://www.google.com" target="_blank">
                Google
            </a>
        </li>

        <li>
            <a href="https://www.youtube.com" target="_blank">
                YouTube
            </a>
        </li>

        <li>
            <a href="https://github.com/hifza615" target="_blank">
                My GitHub
            </a>
        </li>

        <li>
            <a href="https://www.linkedin.com/in/hifza-emaan-3b06193b2/" target="_blank">
                LinkedIn
            </a>
        </li>

    </ul>

    <h2>Website Logos</h2>

    <!-- Google Logo -->
    <a href="https://www.google.com" target="_blank">
        <img
            src="https://www.google.com/favicon.ico"
            alt="Google Logo"
            width="50"
        >
    </a>
<br>
<br>
    <!-- YouTube Logo -->
    <a href="https://www.youtube.com" target="_blank">
        <img
            src="https://www.youtube.com/favicon.ico"
            alt="YouTube Logo"
            width="50"
        >
    </a>
<br>
<br>
    <!-- GitHub Logo -->
    <a href="https://github.com/hifza615" target="_blank">
        <img
            src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
            alt="GitHub Logo"
            width="50"
        >
    </a>
    <br>
    <br>

    <!-- LinkedIn Logo -->
    <a href="https://www.linkedin.com/in/hifza-emaan-3b06193b2/" target="_blank">
        <img
            src="https://cdn-icons-png.flaticon.com/512/174/174857.png"
            alt="LinkedIn Logo"
            width="50"
        >
    </a>

</body>

</html>
