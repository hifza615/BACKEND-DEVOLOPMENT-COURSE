<!-- =========================================================
     HTML BASICS — ASSIGNMENT 01
     QUESTION 3 — CREATE A STUDENT MARKS TABLE
     =========================================================

     Question:
     Create a webpage containing a table titled
     "Student Marks".

     Data:

     Roll No | Student Name | HTML | CSS | Total
     101     | Ali          | 80   | 75  | 155
     102     | Sara         | 90   | 85  | 175
     103     | Ahmed        | 70   | 80  | 150
     104     | Ayesha       | 95   | 90  | 185

     Your HTML table must:
     1. Have a heading above the table.
     2. Use <table>, <tr>, <th>, and <td> correctly.
     3. Have a proper header row.
     4. Contain all four students and their marks.
     5. Include a <caption> describing the table.

     Task:
     Write the complete HTML code for the table.

     =========================================================
     ANSWER
     =========================================================
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks</title>
</head>

<body>

    <h1>Student Marks</h1>

    <table border="1">
        <caption>Student Marks for HTML and CSS</caption>

        <tr>
            <th>Roll No</th>
            <th>Student Name</th>
            <th>HTML</th>
            <th>CSS</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Ali</td>
            <td>80</td>
            <td>75</td>
            <td>155</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Sara</td>
            <td>90</td>
            <td>85</td>
            <td>175</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Ahmed</td>
            <td>70</td>
            <td>80</td>
            <td>150</td>
        </tr>

        <tr>
            <td>104</td>
            <td>Ayesha</td>
            <td>95</td>
            <td>90</td>
            <td>185</td>
        </tr>

    </table>

</body>

</html>
